version = 1
[[annotations]]
path = [
    ".DS_Store",
    ".gitattributes",
    ".gitignore",
    ".pdd",
    "**.conf",
    "**.css",
    "**.est",
    "**.html",
    "**.ico",
    "**.ini",
    "**.js",
    "**.json",
    "**.key",
    "**.md",
    "**.php",
    "**.png",
    "**.scss",
    "**.sh",
    "**.svg",
    "**.txt",
    "**.vm",
    "**/.DS_Store",
    "**/.gitignore",
    "**/.pdd",
    "**/*.conf",
    "**/*.css",
    "**/*.csv",
    "**/*.est",
    "**/*.html",
    "**/*.ico",
    "**/*.ini",
    "**/*.jpg",
    "**/*.js",
    "**/*.json",
    "**/*.key",
    "**/*.md",
    "**/*.pdf",
    "**/*.php",
    "**/*.png",
    "**/*.scss",
    "**/*.sh",
    "**/*.svg",
    "**/*.txt",
    "**/*.vm",
    "**/CNAME",
    "**/Gemfile.lock",
    "**/id_rsa",
    "**/MANIFEST.MF",
    "**/Procfile",
    "CNAME",
    "MANIFEST.MF",
    "Procfile",
    "README.md",
    "renovate.json",
]
precedence = "override"
